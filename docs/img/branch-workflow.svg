<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title description">
  <title id="title">Jerry Git branch workflow</title>
  <desc id="description">Jerry development flow: feature topic branches merge into the features integration branch, then into testing, and then production. Main is the repository default branch. Proction is a legacy misspelled branch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0 0 12 5 0 10Z" fill="#54718d"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17324d}.title{font-size:34px;font-weight:700}.subtitle{font-size:16px;fill:#53677d}.head{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:600}.small{font-size:13px;fill:#53677d}.tiny{font-size:12px;fill:#53677d}.box{filter:url(#shadow);stroke-width:1.5}.arrow{fill:none;stroke:#54718d;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#a6b3c0;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1500" height="760" rx="24" fill="url(#bg)"/>
  <text x="64" y="72" class="title">Jerry — Git Branch Workflow</text>
  <text x="64" y="103" class="subtitle">Feature work progresses through integration and verification before production.</text>

  <rect x="52" y="145" width="1396" height="465" rx="22" fill="#fff" opacity=".8" stroke="#d8e2ec"/>
  <text x="82" y="185" class="small" style="font-weight:700;letter-spacing:1px">PLANNED MERGE PATH</text>

  <rect class="box" x="105" y="264" width="270" height="150" rx="18" fill="#eef5ff" stroke="#9bbce8"/>
  <text x="135" y="304" class="head">Feature branches</text>
  <text x="135" y="340" class="label">feature/*</text>
  <text x="135" y="370" class="small">One branch per feature or change</text>
  <text x="135" y="394" class="tiny">Examples: feature/hybrid-search</text>

  <path class="arrow" d="M375 339 H486"/>
  <text x="393" y="319" class="tiny">merge / PR</text>

  <rect class="box" x="495" y="264" width="245" height="150" rx="18" fill="#effaf7" stroke="#8bcab6"/>
  <text x="525" y="304" class="head">features</text>
  <text x="525" y="340" class="label">Feature integration</text>
  <text x="525" y="372" class="small">Combine completed work</text>

  <path class="arrow" d="M740 339 H851"/>
  <text x="757" y="319" class="tiny">merge / PR</text>

  <rect class="box" x="860" y="264" width="245" height="150" rx="18" fill="#fff8e9" stroke="#e7c16b"/>
  <text x="890" y="304" class="head">testing</text>
  <text x="890" y="340" class="label">Integration verification</text>
  <text x="890" y="372" class="small">Run checks before release</text>

  <path class="arrow" d="M1105 339 H1216"/>
  <text x="1122" y="319" class="tiny">merge / PR</text>

  <rect class="box" x="1225" y="264" width="190" height="150" rx="18" fill="#fff1ee" stroke="#e5a99d"/>
  <text x="1255" y="304" class="head">production</text>
  <text x="1255" y="340" class="label">Release branch</text>
  <text x="1255" y="372" class="small">Deployable version</text>

  <rect x="105" y="475" width="510" height="90" rx="15" fill="#f4f7fa" stroke="#bccbd8"/>
  <text x="132" y="510" class="head">main</text>
  <text x="132" y="540" class="small">Repository default branch (origin/HEAD currently points here)</text>

  <rect x="660" y="475" width="755" height="90" rx="15" fill="#f7f7f8" stroke="#c7cbd0" stroke-dasharray="7 6"/>
  <text x="688" y="510" class="head" style="fill:#6c7782">Proction</text>
  <text x="688" y="540" class="small">Legacy branch with the original spelling; not part of the stated merge flow.</text>

  <text x="64" y="662" class="small">This shows the team's intended branch workflow, not a guarantee that every local and remote branch pointer is synchronized.</text>
  <text x="64" y="691" class="tiny">Use pull requests or merges to move changes between stages; keep production changes reviewed and tested.</text>
</svg>
