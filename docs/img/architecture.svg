<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title description">
  <title id="title">Jerry application architecture</title>
  <desc id="description">Architecture diagram showing the Streamlit user interface, FastAPI security and service layer, LangGraph assistant, retrieval and tools, sample documents and optional providers, plus LangSmith tracing and streamed activity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#60758c"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#3574c8"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17324d}.title{font-size:34px;font-weight:700}.subtitle{font-size:16px;fill:#53677d}.head{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:600}.small{font-size:13px;fill:#53677d}.tiny{font-size:12px;fill:#53677d}.box{filter:url(#shadow);stroke-width:1.5}.line{fill:none;stroke:#60758c;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#8ca0b5;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}.flow{fill:none;stroke:#3574c8;stroke-width:3;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1500" height="980" rx="24" fill="url(#bg)"/>
  <text x="64" y="72" class="title">Jerry — Enterprise Knowledge Assistant</text>
  <text x="64" y="103" class="subtitle">Application architecture · local demo services with optional hosted integrations</text>

  <!-- Main request and response path -->
  <rect x="52" y="145" width="1396" height="520" rx="22" fill="#fff" opacity=".78" stroke="#d8e2ec"/>
  <text x="78" y="180" class="small" style="font-weight:700;letter-spacing:1px">INTERACTIVE ASSISTANT</text>

  <rect class="box" x="85" y="235" width="245" height="142" rx="16" fill="#eef5ff" stroke="#9bbce8"/>
  <text x="110" y="272" class="head">Streamlit UI</text>
  <text x="110" y="302" class="label">Chat · demo role selector</text>
  <text x="110" y="328" class="label">Sources · live activity</text>
  <text x="110" y="354" class="small">ui/streamlit_app.py</text>

  <path class="flow" d="M330 306 H402"/>
  <text x="340" y="290" class="tiny">HTTP / SSE</text>

  <rect class="box" x="408" y="210" width="315" height="194" rx="16" fill="#effaf7" stroke="#8bcab6"/>
  <text x="435" y="248" class="head">FastAPI service</text>
  <text x="435" y="278" class="label">Chat · tools · health routes</text>
  <text x="435" y="306" class="label">Token roles · rate limits</text>
  <text x="435" y="334" class="label">Validation · safe errors</text>
  <text x="435" y="372" class="small">api/ · core/ · security/</text>

  <path class="flow" d="M723 306 H795"/>
  <text x="734" y="290" class="tiny">validated state</text>

  <rect class="box" x="801" y="210" width="315" height="194" rx="16" fill="#f5f0ff" stroke="#b7a1e5"/>
  <text x="828" y="248" class="head">LangGraph assistant</text>
  <text x="828" y="278" class="label">Route intent · retrieve evidence</text>
  <text x="828" y="306" class="label">Analyze · check citations</text>
  <text x="828" y="334" class="label">Bounded retry · grounded reply</text>
  <text x="828" y="372" class="small">agent/</text>

  <path class="line" d="M958 404 V451 H560 V478"/>
  <path class="line" d="M958 451 H1000 V478"/>

  <rect class="box" x="398" y="480" width="327" height="145" rx="16" fill="#fff8e9" stroke="#e7c16b"/>
  <text x="425" y="516" class="head">Retrieval</text>
  <text x="425" y="546" class="label">BM25 keyword search</text>
  <text x="425" y="573" class="label">Optional dense + hybrid ranking</text>
  <text x="425" y="602" class="small">retrieval/ · citations</text>

  <rect class="box" x="834" y="480" width="327" height="145" rx="16" fill="#fff1ee" stroke="#e5a99d"/>
  <text x="861" y="516" class="head">Authorized tools</text>
  <text x="861" y="546" class="label">Structured Python analysis</text>
  <text x="861" y="573" class="label">Local MCP-style demo tools</text>
  <text x="861" y="602" class="small">tools/ · permissions checked</text>

  <!-- Supporting systems -->
  <rect x="52" y="698" width="1396" height="224" rx="22" fill="#fff" opacity=".78" stroke="#d8e2ec"/>
  <text x="78" y="733" class="small" style="font-weight:700;letter-spacing:1px">KNOWLEDGE, OPERATIONS &amp; OPTIONAL PROVIDERS</text>

  <rect x="88" y="770" width="305" height="112" rx="14" fill="#f4f7fa" stroke="#bccbd8"/>
  <text x="112" y="805" class="head">Document pipeline</text>
  <text x="112" y="834" class="label">Markdown → chunks → embeddings</text>
  <text x="112" y="860" class="small">scripts/ · data/sample_docs/</text>

  <path class="line" d="M393 826 H447"/>
  <rect x="454" y="770" width="292" height="112" rx="14" fill="#fff8e9" stroke="#e7c16b"/>
  <text x="478" y="805" class="head">Indexes</text>
  <text x="478" y="834" class="label">Local JSONL index</text>
  <text x="478" y="860" class="small">Optional Pinecone backend</text>
  <path class="dash" d="M561 625 V750"/>

  <rect x="789" y="770" width="275" height="112" rx="14" fill="#f5f0ff" stroke="#b7a1e5"/>
  <text x="813" y="805" class="head">Observability</text>
  <text x="813" y="834" class="label">Trace IDs · activity events</text>
  <text x="813" y="860" class="small">Optional LangSmith tracing</text>
  <path class="dash" d="M958 404 V740 H926 V762"/>

  <rect x="1107" y="770" width="290" height="112" rx="14" fill="#effaf7" stroke="#8bcab6"/>
  <text x="1131" y="805" class="head">Model providers</text>
  <text x="1131" y="834" class="label">Local extractive fallback</text>
  <text x="1131" y="860" class="small">Optional hosted LLM / embeddings</text>
  <path class="dash" d="M1080 404 V448 H1250 V762"/>

  <text x="78" y="951" class="tiny">Solid arrows show the primary request/data flow. Dashed arrows show supporting or optional integrations.</text>
</svg>
